name: ci

on:
  push:
    branches: [main]
  pull_request:

# a newer push to the same branch/PR cancels the run that is still in progress
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# least privilege: jobs can only read the repository
permissions:
  contents: read

jobs:
  jars-api:
    name: jars-api (build, tests, modulith, spotless)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/jars-api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: apps/jars-api/pom.xml

      # Testcontainers uses the Docker engine that ubuntu-latest runners provide
      - name: Verify
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: apps/jars-api/target/surefire-reports/
          retention-days: 7

      - name: Upload module documentation
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: modulith-docs
          path: apps/jars-api/target/spring-modulith-docs/
          retention-days: 7

  jars-api-image:
    name: jars-api image (arm64, like Fargate Graviton)
    # native arm64 runner (free for public repositories): no QEMU emulation, and the image is the one Fargate runs
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/jars-api
    steps:
      - uses: actions/checkout@v7

      # the plain target needs no database; the AOT-cache target is built by the deploy pipeline (P3.6)
      - name: Build
        run: docker build --target plain -t jars-api:ci .

      - name: Check the image
        run: |
          test "$(docker image inspect jars-api:ci --format '{{.Architecture}}')" = "arm64"
          test "$(docker image inspect jars-api:ci --format '{{.Config.User}}')" = "10001:10001"
          docker run --rm --entrypoint java jars-api:ci -version

  web:
    name: web (API types, lint, typecheck, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # exact versions from the lockfile; no install scripts run (supply chain), nothing in the build needs them
      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund

      # src/api/schema.d.ts must match contracts/openapi/jars-api.yaml (the file jars-api's contract test guards):
      # an API change that the UI has not picked up fails here, and tsc then shows every screen it breaks
      - name: API types up to date
        run: npm run api:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npx vite build

  infra-cdk:
    name: infra/cdk (CDK assertions, cdk-nag, spotless)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: infra/cdk
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: infra/cdk/pom.xml

      # jsii (the bridge between Java and the TypeScript CDK) needs Node.js
      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # template assertions + cdk-nag run as JUnit tests; no AWS credentials needed
      - name: Verify
        run: ./mvnw --batch-mode --no-transfer-progress verify

  gitleaks:
    name: gitleaks (secret scan, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan every commit, not just the last one

      # third-party action pinned to a commit SHA (v3.0.0) so a moved tag cannot inject code
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false" # no PR comments, so the job needs no write permission
