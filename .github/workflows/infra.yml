name: infra

# CDK infrastructure (infra/cdk): unit tests with cdk-nag, then a real synth. Nothing here talks to AWS:
# the job has no credentials and never runs bootstrap, diff or deploy.
on:
  push:
    branches: [main]
    paths:
      - "infra/cdk/**"
      - ".github/workflows/infra.yml"
  pull_request:
    paths:
      - "infra/cdk/**"
      - ".github/workflows/infra.yml"

# a newer push to the same branch/PR cancels the run that is still in progress
concurrency:
  group: infra-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# least privilege: jobs can only read the repository
permissions:
  contents: read

jobs:
  cdk:
    name: cdk (tests, cdk-nag, synth)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: infra/cdk
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: infra/cdk/pom.xml

      # Template assertions, the guardrails (no NAT, ARM64, no 0.0.0.0/0 ingress, log retention, ...) and
      # the cdk-nag AwsSolutions pack. The jsii runtime needs Node, which ubuntu-latest provides.
      - name: Test
        run: ./mvnw --batch-mode --no-transfer-progress test

      # The same synth as on a developer machine. A cdk-nag finding without an acknowledgement fails it.
      # imageTag only has to be non-empty so that JarsApp is part of the synth.
      - name: Synth
        run: npx --yes aws-cdk@2 synth --quiet -c imageTag=ci

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: infra-surefire-reports
          path: infra/cdk/target/surefire-reports/
          retention-days: 7

      - name: Upload synthesized templates
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: cloudformation-templates
          path: |
            infra/cdk/cdk.out/*.template.json
            infra/cdk/cdk.out/validation-report.json
          retention-days: 7
