openapi: 3.1.0
info:
  description: Personal finance with the 6-jars method. Money amounts are strings
    with two decimals; every POST that changes money needs an Idempotency-Key header;
    errors are RFC 9457 problem+json.
  title: Jars Platform API
  version: v1
servers:
- url: /
security:
- cognito: []
paths:
  /api/v1/anomalies:
    get:
      operationId: anomalies
      parameters:
      - in: query
        name: status
        required: false
        schema:
          type: string
          enum:
          - OPEN
          - CONFIRMED
          - EXPECTED
          - FALSE_POSITIVE
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
      - in: query
        name: cursor
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AnomalyPage"
          description: OK
      tags:
      - insights-controller
  /api/v1/anomalies/{id}/feedback:
    post:
      operationId: feedback
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AnomalyView"
          description: OK
      tags:
      - insights-controller
  /api/v1/audit-log:
    get:
      operationId: auditLog
      parameters:
      - in: query
        name: action
        required: false
        schema:
          type: string
          enum:
          - TRANSACTION_POSTED
          - JAR_TRANSFERRED
          - INCOME_ALLOCATED
          - TRANSACTION_RECATEGORIZED
          - JAR_CREATED
          - JAR_UPDATED
          - JAR_ARCHIVED
          - ALLOCATION_DECIDED
          - MONTH_CLOSED
          - GOAL_CREATED
          - GOAL_UPDATED
          - GOAL_ARCHIVED
          - PROFILE_UPDATED
          - RISK_PROFILE_SUBMITTED
          - IMPORT_CREATED
          - ANOMALY_FEEDBACK_GIVEN
      - in: query
        name: entityType
        required: false
        schema:
          type: string
          enum:
          - TRANSACTION
          - JAR
          - GOAL
          - USER
          - RISK_ASSESSMENT
          - ALLOCATION_DECISION
          - STATEMENT_IMPORT
          - ANOMALY
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
      - in: query
        name: cursor
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuditPage"
          description: OK
      tags:
      - audit-log-controller
  /api/v1/balances/daily:
    get:
      operationId: dailyBalances
      parameters:
      - in: query
        name: days
        required: false
        schema:
          type: integer
          format: int32
          default: 30
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DailyBalanceView"
          description: OK
      tags:
      - transaction-controller
  /api/v1/budget/allocation-suggestions:
    post:
      operationId: suggest
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuggestionRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Suggestion"
          description: OK
      tags:
      - budget-controller
  /api/v1/budget/allocations:
    post:
      operationId: apply
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AllocationRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AllocationResult"
          description: OK
      tags:
      - budget-controller
  /api/v1/budget/periods/{month}:
    get:
      operationId: period
      parameters:
      - in: path
        name: month
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PeriodView"
          description: OK
      tags:
      - budget-controller
  /api/v1/categories:
    get:
      operationId: categories
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryView"
          description: OK
      tags:
      - transaction-controller
  /api/v1/chat/sessions:
    get:
      operationId: sessions
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionView"
          description: OK
      tags:
      - advisor-controller
    post:
      operationId: create_2
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SessionView"
          description: Created
      tags:
      - advisor-controller
  /api/v1/chat/sessions/{sessionId}/messages:
    get:
      operationId: messages
      parameters:
      - in: path
        name: sessionId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MessageView"
          description: OK
      tags:
      - advisor-controller
    post:
      operationId: send
      parameters:
      - in: path
        name: sessionId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
        required: true
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/SseEmitter"
          description: OK
      tags:
      - advisor-controller
  /api/v1/dashboard:
    get:
      operationId: dashboard
      parameters:
      - in: query
        name: month
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Dashboard"
          description: OK
      tags:
      - insights-controller
  /api/v1/goals:
    get:
      operationId: listGoals
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GoalView"
          description: OK
      tags:
      - goal-controller
    post:
      operationId: createGoal
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGoalRequest"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GoalView"
          description: Created
      tags:
      - goal-controller
  /api/v1/goals/{id}:
    delete:
      operationId: archiveGoal
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
      tags:
      - goal-controller
    patch:
      operationId: updateGoal
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGoalRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GoalView"
          description: OK
      tags:
      - goal-controller
  /api/v1/goals/{id}/feasibility:
    get:
      operationId: goalFeasibility
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/FeasibilityView"
          description: OK
      tags:
      - goal-controller
  /api/v1/goals/{id}/roadmap:
    get:
      operationId: goalRoadmap
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoadmapResponse"
          description: OK
      tags:
      - goal-controller
  /api/v1/goals/{id}/scenarios:
    post:
      operationId: goalScenarios
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScenarioRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ScenarioView"
          description: OK
      tags:
      - goal-controller
  /api/v1/health:
    get:
      operationId: health
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/HealthResponse"
          description: OK
      tags:
      - health-controller
  /api/v1/imports:
    get:
      operationId: history
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ImportView"
          description: OK
      tags:
      - import-controller
    post:
      operationId: create_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateImportRequest"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CreatedImport"
          description: Created
      tags:
      - import-controller
  /api/v1/imports/{importId}:
    get:
      operationId: get
      parameters:
      - in: path
        name: importId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ImportView"
          description: OK
      tags:
      - import-controller
  /api/v1/jars:
    get:
      operationId: list_1
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JarView"
          description: OK
      tags:
      - jar-controller
    post:
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJarRequest"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JarView"
          description: Created
      tags:
      - jar-controller
  /api/v1/jars/transfers:
    post:
      operationId: transfer
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TransactionReceipt"
          description: OK
      tags:
      - jar-controller
  /api/v1/jars/{id}:
    delete:
      operationId: archive
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
      tags:
      - jar-controller
    patch:
      operationId: update_1
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateJarRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JarView"
          description: OK
      tags:
      - jar-controller
  /api/v1/me:
    get:
      operationId: me
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MeResponse"
          description: OK
      tags:
      - me-controller
    patch:
      operationId: update
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MeResponse"
          description: OK
      tags:
      - me-controller
  /api/v1/me/risk-profile:
    get:
      operationId: riskProfile
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RiskProfileResponse"
          description: OK
      tags:
      - me-controller
    put:
      operationId: submitRiskProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RiskAnswersRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RiskProfileResponse"
          description: OK
      tags:
      - me-controller
  /api/v1/notifications:
    get:
      operationId: list_2
      parameters:
      - in: query
        name: unreadOnly
        required: false
        schema:
          type: boolean
          default: false
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
      - in: query
        name: cursor
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/NotificationPage"
          description: OK
      tags:
      - notification-controller
  /api/v1/notifications/stream:
    get:
      operationId: stream
      parameters:
      - in: header
        name: Last-Event-ID
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/SseEmitter"
          description: OK
      tags:
      - notification-controller
  /api/v1/notifications/{id}/read:
    post:
      operationId: read
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/NotificationView"
          description: OK
      tags:
      - notification-controller
  /api/v1/transactions:
    get:
      operationId: list
      parameters:
      - in: query
        name: jarId
        required: false
        schema:
          type: string
          format: uuid
      - in: query
        name: categoryId
        required: false
        schema:
          type: string
          format: uuid
      - in: query
        name: type
        required: false
        schema:
          type: string
          enum:
          - INCOME
          - EXPENSE
          - JAR_TRANSFER
      - in: query
        name: from
        required: false
        schema:
          type: string
          format: date-time
      - in: query
        name: to
        required: false
        schema:
          type: string
          format: date-time
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
      - in: query
        name: cursor
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TransactionPage"
          description: OK
      tags:
      - transaction-controller
    post:
      operationId: post
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostTransactionRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TransactionReceipt"
          description: OK
      tags:
      - transaction-controller
  /api/v1/transactions/{id}:
    patch:
      operationId: recategorize
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchTransactionRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TransactionView"
          description: OK
      tags:
      - transaction-controller
  /dev/token:
    post:
      operationId: token
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: object
                additionalProperties: {}
          description: OK
      tags:
      - token-controller
components:
  schemas:
    AllocationRequest:
      type: object
      properties:
        amount:
          type: number
          exclusiveMinimum: 0
        categoryId:
          type: string
          format: uuid
        counterparty:
          type: string
          maxLength: 120
          minLength: 0
        note:
          type: string
          maxLength: 500
          minLength: 0
        occurredAt:
          type: string
          format: date-time
        skip:
          type: boolean
        splits:
          type: array
          items:
            $ref: "#/components/schemas/SplitRequest"
          maxItems: 50
          minItems: 0
      required:
      - amount
    AllocationResult:
      type: object
      properties:
        amount:
          $ref: "#/components/schemas/Money"
        decision:
          type: string
        decisionId:
          type: string
          format: uuid
        month:
          type: string
        splits:
          type: array
          items:
            $ref: "#/components/schemas/AppliedSplit"
        transactionId:
          type: string
          format: uuid
    AnomalyPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AnomalyView"
        nextCursor:
          type: string
    AnomalyView:
      type: object
      properties:
        amount:
          $ref: "#/components/schemas/Money"
        detectedAt:
          type: string
          format: date-time
        detector:
          type: string
        direction:
          type: string
        id:
          type: string
          format: uuid
        jarId:
          type: string
          format: uuid
        jarName:
          type: string
        score:
          type: number
          format: double
        severity:
          type: string
        status:
          type: string
        threshold:
          type: number
          format: double
        transactionId:
          type: string
          format: uuid
    AppliedSplit:
      type: object
      properties:
        amount:
          $ref: "#/components/schemas/Money"
        balance:
          $ref: "#/components/schemas/Money"
        jarId:
          type: string
          format: uuid
    AuditEntryView:
      type: object
      properties:
        action:
          type: string
        entityId:
          type: string
          format: uuid
        entityType:
          type: string
        id:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
        payload:
          type: object
          additionalProperties: {}
        traceId:
          type: string
    AuditPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntryView"
        nextCursor:
          type: string
    CategorySpend:
      type: object
      properties:
        categoryId:
          type: string
          format: uuid
        name:
          type: string
        spent:
          $ref: "#/components/schemas/Money"
        txnCount:
          type: integer
          format: int32
    CategoryView:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
        name:
          type: string
        parentId:
          type: string
          format: uuid
        system:
          type: boolean
    CreateGoalRequest:
      type: object
      properties:
        fundingJarId:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 80
          minLength: 0
        targetAmount:
          type: number
          exclusiveMinimum: 0
        targetDate:
          type: string
          format: date
      required:
      - name
      - targetAmount
      - targetDate
    CreateImportRequest:
      type: object
      properties:
        fileName:
          type: string
          maxLength: 200
          minLength: 0
      required:
      - fileName
    CreateJarRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 40
          minLength: 0
        targetPct:
          type: number
          maximum: 100
          minimum: 0
      required:
      - name
    CreateSessionRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 80
          minLength: 0
    CreatedImport:
      type: object
      properties:
        statementImport:
          $ref: "#/components/schemas/ImportView"
        upload:
          $ref: "#/components/schemas/UploadTarget"
    CurrentCapacity:
      type: object
      properties:
        amount:
          type: number
        label:
          type: string
    DailyBalanceView:
      type: object
      properties:
        balance:
          $ref: "#/components/schemas/Money"
        date:
          type: string
          format: date
    Dashboard:
      type: object
      properties:
        balance:
          $ref: "#/components/schemas/Money"
        expense:
          $ref: "#/components/schemas/Money"
        income:
          $ref: "#/components/schemas/Money"
        month:
          type: string
        net:
          $ref: "#/components/schemas/Money"
        openAnomalies:
          type: integer
          format: int64
        spendByCategory:
          type: array
          items:
            $ref: "#/components/schemas/CategorySpend"
        spendByJar:
          type: array
          items:
            $ref: "#/components/schemas/JarSpend"
        trend:
          type: array
          items:
            $ref: "#/components/schemas/MonthFlow"
    Deltas:
      type: object
      properties:
        income:
          $ref: "#/components/schemas/Money"
        monthlySaving:
          $ref: "#/components/schemas/Money"
        oneOff:
          $ref: "#/components/schemas/Money"
        spending:
          $ref: "#/components/schemas/Money"
    Explanation:
      type: object
      properties:
        cautions:
          type: array
          items:
            type: string
        confidenceNote:
          type: string
        projectionExplanation:
          $ref: "#/components/schemas/ProjectionExplanation"
        summary:
          type: string
    FeasibilityView:
      type: object
      properties:
        currentAmount:
          $ref: "#/components/schemas/Money"
        currentMonthlyPace:
          $ref: "#/components/schemas/Money"
        feasibilityHint:
          type: string
        fundingJarLinked:
          type: boolean
        gap:
          $ref: "#/components/schemas/Money"
        goalId:
          type: string
          format: uuid
        goalName:
          type: string
        grade:
          type: string
        monthlyShortfall:
          $ref: "#/components/schemas/Money"
        monthsLeft:
          type: integer
          format: int32
        notes:
          type: array
          items:
            type: string
        pace:
