openapi: 3.1.0
info:
  title: Jars Platform API
  description: Personal finance with the 6-jars method. Money amounts are strings
    with two decimals; every POST that changes money needs an Idempotency-Key header;
    errors are RFC 9457 problem+json.
  version: v1
servers:
- url: /
security:
- cognito: []
paths:
  /api/v1/me/risk-profile:
    get:
      tags:
      - me-controller
      operationId: riskProfile
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RiskProfileResponse"
    put:
      tags:
      - me-controller
      operationId: submitRiskProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RiskAnswersRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RiskProfileResponse"
  /dev/token:
    post:
      tags:
      - token-controller
      operationId: token
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties: {}
  /api/v1/transactions:
    get:
      tags:
      - transaction-controller
      operationId: list
      parameters:
      - name: jarId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: categoryId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: type
        in: query
        required: false
        schema:
          type: string
          enum:
          - INCOME
          - EXPENSE
          - JAR_TRANSFER
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TransactionPage"
    post:
      tags:
      - transaction-controller
      operationId: post
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostTransactionRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TransactionReceipt"
  /api/v1/notifications/{id}/read:
    post:
      tags:
      - notification-controller
      operationId: read
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/NotificationView"
  /api/v1/jars:
    get:
      tags:
      - jar-controller
      operationId: list_1
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JarView"
    post:
      tags:
      - jar-controller
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJarRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JarView"
  /api/v1/jars/transfers:
    post:
      tags:
      - jar-controller
      operationId: transfer
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TransactionReceipt"
  /api/v1/goals:
    get:
      tags:
      - goal-controller
      operationId: listGoals
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GoalView"
    post:
      tags:
      - goal-controller
      operationId: createGoal
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGoalRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GoalView"
  /api/v1/goals/{id}/scenarios:
    post:
      tags:
      - goal-controller
      operationId: goalScenarios
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScenarioRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ScenarioView"
  /api/v1/budget/allocations:
    post:
      tags:
      - budget-controller
      operationId: apply
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AllocationRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AllocationResult"
  /api/v1/budget/allocation-suggestions:
    post:
      tags:
      - budget-controller
      operationId: suggest
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuggestionRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Suggestion"
  /api/v1/anomalies/{id}/feedback:
    post:
      tags:
      - insights-controller
      operationId: feedback
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AnomalyView"
  /api/v1/transactions/{id}:
    patch:
      tags:
      - transaction-controller
      operationId: recategorize
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchTransactionRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TransactionView"
  /api/v1/me:
    get:
      tags:
      - me-controller
      operationId: me
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MeResponse"
    patch:
      tags:
      - me-controller
      operationId: update
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MeResponse"
  /api/v1/jars/{id}:
    delete:
      tags:
      - jar-controller
      operationId: archive
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
    patch:
      tags:
      - jar-controller
      operationId: update_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateJarRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JarView"
  /api/v1/goals/{id}:
    delete:
      tags:
      - goal-controller
      operationId: archiveGoal
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
    patch:
      tags:
      - goal-controller
      operationId: updateGoal
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGoalRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GoalView"
  /api/v1/notifications:
    get:
      tags:
      - notification-controller
      operationId: list_2
      parameters:
      - name: unreadOnly
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/NotificationPage"
  /api/v1/notifications/stream:
    get:
      tags:
      - notification-controller
      operationId: stream
      parameters:
      - name: Last-Event-ID
        in: header
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/SseEmitter"
  /api/v1/health:
    get:
      tags:
      - health-controller
      operationId: health
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/goals/{id}/roadmap:
    get:
      tags:
      - goal-controller
      operationId: goalRoadmap
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoadmapResponse"
  /api/v1/goals/{id}/feasibility:
    get:
      tags:
      - goal-controller
      operationId: goalFeasibility
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/FeasibilityView"
  /api/v1/dashboard:
    get:
      tags:
      - insights-controller
      operationId: dashboard
      parameters:
      - name: month
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Dashboard"
  /api/v1/categories:
    get:
      tags:
      - transaction-controller
      operationId: categories
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryView"
  /api/v1/budget/periods/{month}:
    get:
      tags:
      - budget-controller
      operationId: period
      parameters:
      - name: month
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PeriodView"
  /api/v1/balances/daily:
    get:
      tags:
      - transaction-controller
      operationId: dailyBalances
      parameters:
      - name: days
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 30
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DailyBalanceView"
  /api/v1/anomalies:
    get:
      tags:
      - insights-controller
      operationId: anomalies
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - OPEN
          - CONFIRMED
          - EXPECTED
          - FALSE_POSITIVE
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AnomalyPage"
components:
  schemas:
    RiskAnswersRequest:
      type: object
      properties:
        answers:
          type: array
          items:
            type: integer
            format: int32
          maxItems: 5
          minItems: 5
      required:
      - answers
    RiskProfileResponse:
      type: object
      properties:
        score:
          type: integer
          format: int32
        riskLevel:
          type: string
        assessedAt:
          type: string
          format: date-time
    TokenRequest:
      type: object
      properties:
        sub:
          type: string
    PostTransactionRequest:
      type: object
      properties:
        type:
          type: string
          enum:
          - INCOME
          - EXPENSE
          - JAR_TRANSFER
        amount:
          type: number
          exclusiveMinimum: 0
        jarId:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
        counterparty:
          type: string
          maxLength: 120
          minLength: 0
        note:
          type: string
          maxLength: 500
          minLength: 0
        occurredAt:
          type: string
          format: date-time
      required:
      - amount
      - type
    JarBalance:
      type: object
      properties:
        jarId:
          type: string
          format: uuid
        balance:
          $ref: "#/components/schemas/Money"
    Money:
      type: object
      properties:
        amount:
          type: number
        currency:
          type: object
          properties:
            currencyCode:
              type: string
            displayName:
              type: string
            symbol:
              type: string
            defaultFractionDigits:
              type: integer
              format: int32
            numericCode:
              type: integer
              format: int32
            numericCodeAsString:
              type: string
    TransactionReceipt:
      type: object
      properties:
        transaction:
          $ref: "#/components/schemas/TransactionView"
        jarBalances:
          type: array
          items:
            $ref: "#/components/schemas/JarBalance"
    TransactionView:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
        amount:
          $ref: "#/components/schemas/Money"
        jarId:
          type: string
          format: uuid
        toJarId:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
        counterparty:
          type: string
        note:
          type: string
        occurredAt:
          type: string
          format: date-time
        source:
          type: string
    NotificationView:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
        severity:
          type: string
        title:
          type: string
        body:
          type: string
        refType:
          type: string
        refId:
          type: string
          format: uuid
        readAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    CreateJarRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 40
          minLength: 0
        targetPct:
          type: number
          maximum: 100
          minimum: 0
      required:
      - name
    JarView:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        targetPct:
          type: number
        balance:
          $ref: "#/components/schemas/Money"
    TransferRequest:
      type: object
      properties:
        fromJarId:
          type: string
          format: uuid
        toJarId:
          type: string
          format: uuid
        amount:
          type: number
          exclusiveMinimum: 0
        note:
          type: string
          maxLength: 500
          minLength: 0
      required:
      - amount
      - fromJarId
      - toJarId
    CreateGoalRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 80
          minLength: 0
        targetAmount:
          type: number
          exclusiveMinimum: 0
        targetDate:
          type: string
          format: date
        fundingJarId:
          type: string
          format: uuid
      required:
      - name
      - targetAmount
      - targetDate
    GoalView:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        targetAmount:
          $ref: "#/components/schemas/Money"
        targetDate:
          type: string
          format: date
        fundingJarId:
          type: string
          format: uuid
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ScenarioRequest:
      type: object
      properties:
        monthlySavingDelta:
          type: number
        incomeDelta:
          type: number
        spendingDelta:
          type: number
        oneOffContribution:
          type: number
        horizonMonths:
          type: integer
          format: int32
          maximum: 120
          minimum: 1
        seed:
          type: integer
          format: int64
    Deltas:
      type: object
      properties:
        monthlySaving:
          $ref: "#/components/schemas/Money"
        income:
          $ref: "#/components/schemas/Money"
        spending:
          $ref: "#/components/schemas/Money"
        oneOff:
          $ref: "#/components/schemas/Money"
    Pace:
      type: object
      properties:
        monthsUsed:
          type: integer
          format: int32
        currentMonthOnly:
          type: boolean
        averageIncome:
          $ref: "#/components/schemas/Money"
        averageExpense:
          $ref: "#/components/schemas/Money"
        averageNet:
          $ref: "#/components/schemas/Money"
        netStdDev:
          $ref: "#/components/schemas/Money"
    PointView:
      type: object
      properties:
        month:
          type: integer
          format: int32
        p10:
          $ref: "#/components/schemas/Money"
        p50:
          $ref: "#/components/schemas/Money"
        p90:
          $ref: "#/components/schemas/Money"
    ProjectionSummary:
      type: object
      properties:
        strategy:
          type: string
        p10:
          $ref: "#/components/schemas/Money"
        p50:
          $ref: "#/components/schemas/Money"
        p90:
          $ref: "#/components/schemas/Money"
        probabilityOfSuccess:
          type: number
        reachesTarget:
          type: boolean
        path:
          type: array
          items:
            $ref: "#/components/schemas/PointView"
    ScenarioResult:
      type: object
      properties:
        name:
          type: string
        deltas:
          $ref: "#/components/schemas/Deltas"
        monthlyNet:
          $ref: "#/components/schemas/Money"
        deterministic:
          $ref: "#/components/schemas/ProjectionSummary"
        stress:
          $ref: "#/components/schemas/ProjectionSummary"
        monteCarlo:
          $ref: "#/components/schemas/ProjectionSummary"
        medianVsBase:
          $ref: "#/components/schemas/Money"
        probabilityVsBase:
          type: number
    ScenarioView:
      type: object
      properties:
        goalId:
          type: string
          format: uuid
        seed:
          type: integer
          format: int64
        horizonMonths:
          type: integer
          format: int32
        startingAmount:
          $ref: "#/components/schemas/Money"
        targetAmount:
          $ref: "#/components/schemas/Money"
        pace:
          $ref: "#/components/schemas/Pace"
        base:
          $ref: "#/components/schemas/ScenarioResult"
        scenarios:
          type: array
          items:
            $ref: "#/components/schemas/ScenarioResult"
        notes:
          type: array
          items:
            type: string
    AllocationRequest:
      type: object
      properties:
        amount:
          type: number
          exclusiveMinimum: 0
        splits:
          type: array
          items:
            $ref: "#/components/schemas/SplitRequest"
          maxItems: 50
          minItems: 0
        categoryId:
          type: string
          format: uuid
        counterparty:
          type: string
          maxLength: 120
          minLength: 0
        note:
          type: string
          maxLength: 500
          minLength: 0
        occurredAt:
          type: string
          format: date-time
        skip:
          type: boolean
      required:
      - amount
    SplitRequest:
      type: object
      properties:
        jarId:
          type: string
          format: uuid
        amount:
          type: number
          exclusiveMinimum: 0
      required:
      - amount
      - jarId
    AllocationResult:
      type: object
      properties:
        decisionId:
          type: string
          format: uuid
        decision:
          type: string
        transactionId:
          type: string
          format: uuid
        amount:
          $ref: "#/components/schemas/Money"
        month:
          type: string
        splits:
          type: array
          items:
            $ref: "#/components/schemas/AppliedSplit"
    AppliedSplit:
      type: object
      properties:
        jarId:
          type: string
          format: uuid
        amount:
          $ref: "#/components/schemas/Money"
        balance:
          $ref: "#/components/schemas/Money"
    SuggestionRequest:
      type: object
      properties:
        amount:
          type: number
          exclusiveMinimum: 0
      required:
      - amount
    Line:
      type: object
      properties:
        jarId:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        targetPct:
          type: number
        sharePct:
          type: number
        amount:
          $ref: "#/components/schemas/Money"
    Suggestion:
      type: object
      properties:
        amount:
          $ref: "#/components/schemas/Money"
        lines:
          type: array
          items:
            $ref: "#/components/schemas/Line"
        monthsOfHistory:
          type: integer
          format: int32
        historyWeight:
          type: number
    FeedbackRequest:
      type: object
      properties:
        label:
          type: string
          minLength: 1
      required:
      - label
    AnomalyView:
      type: object
      properties:
        id:
          type: string
          format: uuid
        jarId:
          type: string
          format: uuid
        jarName:
          type: string
        transactionId:
          type: string
          format: uuid
        detector:
          type: string
        direction:
          type: string
        severity:
          type: string
        score:
          type: number
          format: double
        threshold:
          type: number
          format: double
        amount:
          $ref: "#/components/schemas/Money"
        status:
          type: string
        detectedAt:
