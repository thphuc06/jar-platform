spring:
  application:
    name: jars-api
  profiles:
    # running locally without SPRING_PROFILES_ACTIVE means "local"; ECS sets SPRING_PROFILES_ACTIVE=aws
    default: local
  threads:
    virtual:
      # Tomcat request handling, @Async and schedulers run on virtual threads (JDK 21+)
      enabled: true
  datasource:
    hikari:
      # every connection uses the "jars" schema; Flyway creates it on first run
      schema: jars
  flyway:
    default-schema: jars
    schemas: jars
  jpa:
    # never keep a DB connection open for the whole HTTP request (anti-pattern, and Aurora could not pause)
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that entities match it and fails fast if not
      ddl-auto: validate
  modulith:
    events:
      # the outbox is a work queue, not history: a publication row is deleted once its listener succeeded
      # (failed ones stay, see docs/02-architecture/event-catalog.md §5). Flyway V2 owns the table, so
      # spring.modulith.events.jdbc.schema-initialization stays at its default (disabled).
      completion-mode: delete

server:
  port: 8080

logging:
  pattern:
    # every log line carries the request's trace id (TraceIdFilter), e.g. "INFO [4bf92f35...]"
    level: "%5p [%X{traceId:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      # /actuator/health/liveness and /actuator/health/readiness, used later by the ALB target group
      probes:
        enabled: true
      # list component names (not details) so it is visible that readiness does NOT depend on the DB
      show-components: always
