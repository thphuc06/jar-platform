spring:
  application:
    name: jars-api
  profiles:
    # running locally without SPRING_PROFILES_ACTIVE means "local"; ECS sets SPRING_PROFILES_ACTIVE=aws
    default: local
  threads:
    virtual:
      # Tomcat request handling, @Async and schedulers run on virtual threads (JDK 21+)
      enabled: true
  datasource:
    # take a pooled connection only when a statement actually runs (Boot 4.1), so a request that is served
    # from cache or fails validation never wakes a paused Aurora
    connection-fetch: lazy
    hikari:
      # every connection uses the "jars" schema; Flyway creates it on first run
      schema: jars
      # keep no idle connections: Aurora Serverless v2 can only auto-pause when nothing is connected (ADR-0008)
      minimum-idle: 0
      idle-timeout: 60000
      max-lifetime: 300000
      # a request that arrives while Aurora resumes may wait up to ~15 s
      connection-timeout: 30000
  jpa:
    properties:
      hibernate:
        default_schema: jars
        # write rows in primary-key order, so two transactions that touch the same jars (a transfer A->B and one B->A)
        # lock them in the same order and cannot deadlock each other
        order_updates: true
        order_inserts: true
        jdbc:
          time_zone: UTC
    # the schema belongs to Flyway; Hibernate only checks that entities match it
    hibernate:
      ddl-auto: validate
    # no lazy loading in the web layer: controllers return DTOs
    open-in-view: false
  flyway:
    default-schema: jars
    schemas: jars
  lifecycle:
    timeout-per-shutdown-phase: 20s
  cloud:
    aws:
      # fixed, so startup never depends on a developer's ~/.aws/config or on AWS_REGION being set (ECS sets it anyway)
      region:
        static: ${AWS_REGION:ap-southeast-1}
      sqs:
        # only the aws profile talks to SQS (it turns this on); local runs and tests never create an SQS client
        enabled: false
      s3:
        # same for S3 (statement uploads): locally the files go to a folder (jars.imports.storage=local)
        enabled: false
  ai:
    model:
      # no chat model locally and in tests (the advisor answers 503); the aws profile selects Bedrock Converse
      chat: none
  batch:
    job:
      # jobs run when a statement arrives (ImportLauncher), never at startup
      enabled: false
    jdbc:
      # the metadata tables are part of Flyway V9
      initialize-schema: never
  modulith:
    events:
      # a finished listener deletes its row from event_publication; unfinished rows stay as the outbox
      completion-mode: delete

server:
  port: 8080
  # finish in-flight requests on SIGTERM (ECS stopTimeout is 30 s)
  shutdown: graceful

jars:
  security:
    # Cognito user pool issuer, e.g. https://cognito-idp.ap-southeast-1.amazonaws.com/ap-southeast-1_xxxx
    # blank = no identity provider: every token is rejected
    issuer-uri: ${JARS_ISSUER_URI:}
    # comma-separated Cognito app client ids whose access tokens are accepted
    allowed-client-ids: ${JARS_ALLOWED_CLIENT_IDS:}
    local-dev-tokens: false
  seed:
    # --jars.seed.enabled=true creates demo data for the token subject "demo" (local profile only)
    enabled: false
  imports:
    # local: files in ${java.io.tmpdir}/jars-statements, uploaded through PUT /api/v1/imports/{id}/file;
    # the aws profile switches to s3 (presigned upload to the statements bucket)
    storage: local
    max-file-size: 5MB
    upload-ttl: 10m
  jobs:
    # name of the SQS queue the EventBridge Scheduler sends jobs to (month close). Only used in the aws profile, where
    # the listener is created; blank everywhere else (nothing connects to AWS locally or in tests)
    queue-name: ${JARS_JOBS_QUEUE:}
    # name of the SQS queue of the nightly ledger reconciliation (balance == SUM(entries)); same rules as queue-name
    reconciliation-queue-name: ${JARS_RECONCILIATION_QUEUE:}

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      # /actuator/health/liveness and /actuator/health/readiness, used later by the ALB target group
      probes:
        enabled: true
      # list component names (not details) so it is visible that readiness does NOT depend on the DB
      show-components: always
  # Traces and metrics leave over OTLP only where a collector listens (the ADOT sidecar on ECS, profile aws). Spans are
  # still created everywhere, so local logs and error bodies carry real trace ids.
  tracing:
    sampling:
      # dev traffic is small: keep every trace (X-Ray records the first 100,000 traces a month for free)
      probability: 1.0
    export:
      otlp:
        enabled: false
  otlp:
    metrics:
      export:
        enabled: false
  logging:
    export:
      otlp:
        # logs go to stdout and the awslogs driver; shipping them over OTLP too would pay for them twice
        enabled: false
  observations:
    enable:
      # Spring Security adds several spans to every request (filter chain, authentication); the request span and
      # the business spans are enough. Health checks are left out by ObservabilityConfig.
      spring.security: false
