spring:
  application:
    name: jars-api
  lifecycle:
    timeout-per-shutdown-phase: 20s
  profiles:
    # running locally without SPRING_PROFILES_ACTIVE means "local"; ECS sets SPRING_PROFILES_ACTIVE=aws
    default: local
  threads:
    virtual:
      # Tomcat request handling, @Async and schedulers run on virtual threads (JDK 21+)
      enabled: true
  datasource:
    hikari:
      # every connection uses the "jars" schema; Flyway creates it on first run
      schema: jars
      # Aurora Serverless v2 pauses (0 ACU, no compute cost) only when NO connection is open for the auto-pause
      # duration. Hikari's default keeps 10 idle connections forever: the database would never pause (~$73/month).
      # Measured locally (P3.3): default = 10 connections held while idle; with these settings = 0 after startup.
      minimum-idle: 0
      idle-timeout: 30000 # milliseconds: HikariConfig takes a long, "30s" does not bind
      # keepalive pings would only touch connections the pool still holds; disabled to keep the intent obvious
      keepalive-time: 0
  flyway:
    default-schema: jars
    schemas: jars
  jpa:
    # never keep a DB connection open for the whole HTTP request (anti-pattern, and Aurora could not pause)
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that entities match it and fails fast if not
      ddl-auto: validate
    properties:
      # UPDATEs are sent ordered by primary key: two opposite transfers (A→B and B→A) then lock the two jar rows in
      # the same order and cannot deadlock each other
      hibernate.order_updates: true
  modulith:
    events:
      # the outbox is a work queue, not history: a publication row is deleted once its listener succeeded
      # (failed ones stay, see docs/02-architecture/event-catalog.md §5). Flyway V2 owns the table, so
      # spring.modulith.events.jdbc.schema-initialization stays at its default (disabled).
      completion-mode: delete

server:
  port: 8080
  # SIGTERM (ECS stops a task): stop accepting requests, finish the running ones, then exit. The container's
  # stopTimeout (30 s) must be longer than the shutdown phase below, otherwise ECS sends SIGKILL in the middle.
  shutdown: graceful

# OpenAPI description (/v3/api-docs) and Swagger UI are OFF by default, so a deployed API does not publish its map;
# profile "local" switches them on. The committed contract is contracts/openapi/jars-api.yaml (OpenApiContractTest).
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
  # the controllers do not declare produces=..., without this every response would be documented as */*
  default-produces-media-type: application/json
  # stable output: keys sorted, so the committed file only changes when the API changes
  writer-with-order-by-keys: true

logging:
  pattern:
    # every log line carries the request's trace id (TraceIdFilter), e.g. "INFO [4bf92f35...]"
    level: "%5p [%X{traceId:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      # /actuator/health/liveness and /actuator/health/readiness, used later by the ALB target group
      probes:
        enabled: true
      # list component names (not details) so it is visible that readiness does NOT depend on the DB
      show-components: always
