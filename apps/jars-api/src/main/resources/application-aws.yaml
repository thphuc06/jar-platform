# Profile "aws": ECS Fargate (SPRING_PROFILES_ACTIVE=aws replaces the default "local" profile).
#
# The task definition provides everything environment-specific, so there are no endpoints or credentials here:
#   SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD   Aurora (username and password come from Secrets Manager)
#   JARS_ISSUER_URI, JARS_ALLOWED_CLIENT_IDS        Cognito user pool and the app clients whose tokens are accepted
#   JARS_JOBS_QUEUE                                 SQS queue that EventBridge Scheduler writes the month-close job to
#   JARS_IMPORTS_BUCKET, JARS_IMPORTS_QUEUE         statements bucket (presigned uploads) and the queue of its S3 events
# Region and credentials for the AWS SDK come from the task role.

spring:
  docker:
    compose:
      enabled: false
  cloud:
    aws:
      sqs:
        enabled: true
        # a span for every message the listener handles (the month-close job), with its trace context in the message
        # attributes when the sender set one
        observation-enabled: true
      s3:
        enabled: true

jars:
  imports:
    storage: s3
    # set by the task definition (JarsApp): the statements bucket of JarsData and the queue of JarsMessaging
    bucket: ${JARS_IMPORTS_BUCKET}
    queue-name: ${JARS_IMPORTS_QUEUE}

logging:
  structured:
    format:
      # one JSON object per line: CloudWatch Logs can filter on fields, and traceId (MDC) is included in every line
      console: ecs

# API documentation is for developers; a deployed instance does not publish it
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoint:
    health:
      # probes answer with the status only
      show-components: never
  # The ADOT collector runs as a sidecar in the same task (localhost): traces go to X-Ray, metrics whose name starts
  # with "jars." become CloudWatch metrics through EMF, everything else is dropped by the collector.
  tracing:
    export:
      otlp:
        enabled: true
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
  otlp:
    metrics:
      export:
        enabled: true
        url: http://localhost:4318/v1/metrics
        step: 1m
